        setGlobalVolume(globalVolume, true);
      }
    }

    async function openPreviewModal(id) {
      const post = postById(id);
      if (!post) return;
      if (post.locked) {
        openCheckout(id);
        return;
      }

      activePreviewId = id;
      document.querySelectorAll(".media video").forEach(v => v.pause());

      const user = author(post.user_id);
      const isVideo = post.kind === "video";
      const isMutedNow = globalMuted || globalVolume === 0;
      const volPercent = isMutedNow ? 0 : Math.round(globalVolume * 100);
      const iconVol = isMutedNow ? "mute" : (globalVolume < 0.5 ? "volumeLow" : "volume");

      const followBtn = state.me?.id === user?.id ? "" : `
        <button class="btn small ${user?.following ? "ghost" : "primary"}" data-action="follow" data-id="${user?.id}">
          ${user?.following ? "Takip ediliyor" : "Takip et"}
        </button>`;

      const mediaHtml = isVideo ? `
        <div class="lightbox-media-wrap">
          <video id="lightboxVideo" src="${esc(post.media)}" loop playsinline preload="auto"></video>
          <div class="lightbox-controls">
            <button class="icon-button" id="lightboxPlayBtn" data-action="preview-play-toggle" aria-label="Oynat/Durdur">${icon("play")}</button>
            <div class="lightbox-progress-wrap">
              <input type="range" class="lightbox-progress" id="lightboxProgress" min="0" max="100" value="0" step="0.1" aria-label="Video süresi">
            </div>
            <span class="lightbox-time" id="lightboxTime">0:00 / 0:00</span>
            <div class="volume-control expanded ${isMutedNow ? "is-muted" : ""}">
              <button class="icon-button" id="lightboxMuteBtn" data-action="preview-mute-toggle" aria-label="Sesi aç/kapat">${icon(iconVol)}</button>
              <div class="volume-slider-wrap" style="width:68px;opacity:1;margin-right:8px;">
                <input type="range" class="volume-slider" id="lightboxVolumeSlider" min="0" max="1" step="0.05" value="${isMutedNow ? 0 : globalVolume}" style="--vol-percent: ${volPercent}%;" aria-label="Ses seviyesi">
              </div>
            </div>
            <button class="icon-button" data-action="preview-fullscreen" aria-label="Tam ekran">${icon("expand")}</button>
          </div>
        </div>
      ` : `
        <div class="lightbox-media-wrap">
          <img src="${esc(post.media)}" alt="${esc(post.caption || "Önizleme")}">
        </div>
      `;

      $("#previewModalBody").innerHTML = `
        ${mediaHtml}
        <div class="lightbox-sidebar">
          <div class="lightbox-sidebar-head">
            <div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1;">
              ${user ? profileButton(user) : "<span></span>"}
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-shrink:0;">
              ${followBtn}
              <button class="modal-close-btn" data-action="close-preview" aria-label="Önizlemeyi kapat">
                ${icon("close")}
              </button>
            </div>
          </div>

          <div class="lightbox-sidebar-content">
            <p class="lightbox-caption">${esc(post.caption || "")}</p>
            <div class="sound" style="margin-bottom:14px;">
              ${icon(post.kind === "video" ? "music" : "image")}
              ${post.kind === "video" ? "Orijinal ses" : "Fotoğraf paylaşımı"} · ${esc(user?.name || "LOOP")}
            </div>
            <div style="font-size:11px;color:#707085;margin-bottom:12px;">
              ${esc(post.created_at?.slice(0, 10) || "")} · ${post.premium ? "Özel paylaşım" : "Herkese açık"}
            </div>
          </div>

          <div class="lightbox-actions-row">
            <button class="action ${post.liked ? "on" : ""}" data-action="like" data-id="${post.id}">
              <i>${icon("heart")}</i> <span>${count(post.likes)}</span>
            </button>
            <button class="action" data-action="preview-comments-focus" data-id="${post.id}">
              <i>${icon("comment")}</i> <span>${count(post.comments)}</span>
            </button>
            <button class="action ${post.saved ? "on" : ""}" data-action="save" data-id="${post.id}">
              <i>${icon("bookmark")}</i> <span>${post.saved ? "Kayıtlı" : "Kaydet"}</span>
            </button>
            <button class="action" data-action="share" data-id="${post.id}">
              <i>${icon("share")}</i> <span>Paylaş</span>
            </button>
          </div>

          <div class="lightbox-comments-wrap" id="lightboxCommentsList">
            <p class="muted" style="font-size:12px;">Yorumlar yükleniyor...</p>
          </div>

          <div class="lightbox-comment-form-wrap">
            ${state.me ? `
              <form id="lightboxCommentForm" class="form" style="gap:8px;">
                <div id="lightboxReplyBarWrap"></div>
                ${state.me.is_admin ? `
                  <div class="comment-as-user-bar">
                    <span class="comment-as-user-badge">${icon("user")} Profil:</span>
                    <div class="comment-as-select-wrap">
                      <select name="as_user_id" class="comment-as-select">
                        ${state.profiles.map(u => `<option value="${u.id}" ${u.id === state.me.id ? "selected" : ""}>${esc(u.name)} (@${esc(u.username)})</option>`).join("")}
                      </select>
                      <span class="comment-as-arrow">${icon("chevronDown")}</span>
                    </div>
                  </div>
                ` : ""}
                <div style="display:flex;gap:8px;">
                  <input id="lightboxCommentInput" name="body" placeholder="Yorum yaz..." required maxlength="500" style="padding:9px 12px;font-size:12.5px;" autocomplete="off">
                  <button class="btn primary small" type="submit">Gönder</button>
                </div>
              </form>
            ` : `
              <button class="btn primary full small" data-action="login">Yorum için giriş yap</button>
            `}
          </div>
        </div>
      `;

      if (!$("#previewModal").open) $("#previewModal").showModal();

      setGlobalVolume(globalVolume, globalMuted);

      if (isVideo) {
        previewVideo = $("#lightboxVideo");
        if (previewVideo) {
          previewVideo.volume = globalVolume;
          previewVideo.muted = globalMuted;
          const playPromise = previewVideo.play();
          if (playPromise) {
            playPromise.then(() => {
              const btn = $("#lightboxPlayBtn");
              if (btn) btn.innerHTML = icon("pause");
            }).catch(() => {});
          }

          previewVideo.addEventListener("play", () => {
            const btn = $("#lightboxPlayBtn");
            if (btn) btn.innerHTML = icon("pause");
          });

          previewVideo.addEventListener("pause", () => {
            const btn = $("#lightboxPlayBtn");
            if (btn) btn.innerHTML = icon("play");
          });

          previewVideo.addEventListener("click", () => {
            if (previewVideo.paused) previewVideo.play().catch(() => {});
            else previewVideo.pause();
          });

          const fmtTime = s => {
            if (!Number.isFinite(s)) return "0:00";
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec < 10 ? "0" : ""}${sec}`;
          };

          previewVideo.addEventListener("timeupdate", () => {
            if (!previewVideo) return;
            const cur = previewVideo.currentTime;
            const dur = previewVideo.duration;
            if (dur > 0) {
              const progress = $("#lightboxProgress");
              const pct = (cur / dur) * 100;
              if (progress) {
                progress.value = pct;
                progress.style.setProperty("--progress-percent", `${pct}%`);
              }
              const timeEl = $("#lightboxTime");
              if (timeEl) timeEl.textContent = `${fmtTime(cur)} / ${fmtTime(dur)}`;
            }
          });

          $("#lightboxProgress")?.addEventListener("input", e => {
            if (previewVideo && previewVideo.duration > 0) {
              const pct = parseFloat(e.target.value);
              e.target.style.setProperty("--progress-percent", `${pct}%`);
              previewVideo.currentTime = (pct / 100) * previewVideo.duration;
            }
          });
        }
      }

      activeLightboxReplyParent = null;
      loadLightboxComments(id);
    }

    function closePreviewModal() {
      if (previewVideo) {
        previewVideo.pause();
        previewVideo = null;
      }
      activePreviewId = null;
      activeLightboxReplyParent = null;
      if ($("#previewModal")?.open) $("#previewModal").close();
      resumeVisibleVideo();
    }

    $("#previewModal")?.addEventListener("click", event => {
      if (event.target !== $("#previewModal")) return;
      const rect = $("#previewModal").getBoundingClientRect();
      if (
        event.clientX < rect.left || event.clientX > rect.right ||
        event.clientY < rect.top || event.clientY > rect.bottom
      ) closePreviewModal();
    });

    $("#previewModal")?.addEventListener("close", () => {
      closePreviewModal();
    });

    function threadComments(comments) {
      if (!comments || !comments.length) return [];
      const map = new Map();
      const roots = [];

      comments.forEach(c => {
        map.set(c.id, { ...c, replies: [] });
      });

      comments.forEach(c => {
        const item = map.get(c.id);
        if (c.parent_id && map.has(c.parent_id)) {
          map.get(c.parent_id).replies.push(item);
        } else {
          roots.push(item);
        }
      });

      return roots;
    }

      const isOwnerOrAdmin = (state.me?.is_admin || state.me?.id === c.user_id);
      return `
        <div class="comment ${isReply ? 'comment-reply' : ''}" style="padding:${isReply ? '3px 0' : '7px 0'};display:flex;gap:${isReply ? '7px' : '9px'};align-items:flex-start;">
          ${avatar(c, isReply ? "mini" : "")}
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;gap:5px;flex-wrap:nowrap;overflow:hidden;">
              <strong style="font-size:${isReply ? '11.5px' : '12px'};color:#f4f4f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(c.name)}</strong>
              ${c.reply_to_username ? `
                <span class="comment-reply-arrow">›</span>
                <span class="comment-reply-badge">@${esc(c.reply_to_username)}</span>
              ` : `
                <small style="font-size:10px;color:var(--muted);white-space:nowrap;">@${esc(c.username)}</small>
              `}
              <small style="font-size:10px;color:var(--muted);white-space:nowrap;margin-left:auto;">${esc(c.created_at?.slice(0, 10) || "")}</small>
              <div style="display:inline-flex;align-items:center;gap:3px;flex-shrink:0;">
                ${state.me ? `

                    Yanıtla

                ${isOwnerOrAdmin ? `
                  <button class="comment-delete-btn" data-action="delete-comment" data-id="${c.id}" data-post-id="${postId}" title="Yorumu sil" aria-label="Yorumu sil">
                    ${icon("close")}

            </div>
            <p style="margin:2px 0 0;font-size:${isReply ? '12px' : '12.5px'};color:#e4e4e7;line-height:1.4;">${esc(c.body)}</p>
          </div>
        </div>
      `;
    }

    function renderThreadedComments(comments, target, postId) {
      if (!comments || comments.length === 0) {
        return '<p class="muted" style="font-size:12px;text-align:center;padding:24px 0;">Henüz yorum yok. İlk yorumu sen yaz!</p>';
      }
      const roots = threadComments(comments);
      return roots.map(root => `
        <div class="comment-thread">
          ${renderCommentItem(root, target, postId, false)}
          ${root.replies.length ? `
            <div class="comment-replies-wrap">
              ${root.replies.map(r => renderCommentItem(r, target, postId, true)).join("")}
            </div>
          ` : ""}
        </div>
      `).join("");
    }

      const container = $("#lightboxCommentsList");

      try {
        const result = await api(`/api/comments/${postId}`);

      } catch (err) {
        if (container) container.innerHTML = '<p class="muted" style="font-size:12px;">Yorumlar yüklenemedi.</p>';
      }
    }

    function renderLightboxComments(comments, postId = activePreviewId) {
      const container = $("#lightboxCommentsList");
      if (!container) return;
      container.innerHTML = renderThreadedComments(comments, "lightbox", postId);

    async function loadState(preserve = false) {
      const requestId = ++stateRequest;
      const previous = preserve
        ? [...document.querySelectorAll(".media video")].map(video => ({
            id: video.closest(".post")?.dataset.post,
            time: video.currentTime
          }))
        : [];

      const next = await api("/api/state");
      if (requestId !== stateRequest) return;
      state = next;
      render();

      if (activePreviewId && $("#previewModal")?.open) {
        const currentPost = postById(activePreviewId);
        if (currentPost) updateLightboxActions(currentPost);
      }

      document.querySelectorAll(".media video").forEach(video => {
        video.volume = globalVolume;
        video.muted = globalMuted;
      });

      previous.forEach(item => {
        if (!item.id) return;
        const video = document.querySelector(`#post-${item.id} video`);
        if (!video) return;
        video.volume = globalVolume;
        video.muted = globalMuted;
        const restore = () => {
          if (Number.isFinite(video.duration)) {
            video.currentTime = Math.min(item.time, video.duration);
          }
        };
        if (video.readyState >= 1) restore();
        else video.addEventListener("loadedmetadata", restore, { once: true });
        const button = document.querySelector(`#post-${item.id} [data-action="mute"]`);
        if (button) button.innerHTML = icon(globalMuted || globalVolume === 0 ? "mute" : (globalVolume < 0.5 ? "volumeLow" : "volume"));
      });
    }

      if (route === "saved") posts = posts.filter(post => post.saved);

                  ? `<div class="volume-control ${isMutedNow ? "is-muted" : ""}" data-id="${post.id}">
                       <button class="icon-button" data-action="mute" data-id="${post.id}" aria-label="Sesi aç veya kapat">${icon(volIcon)}</button>

    function actionButton(action, symbol, label, id, on = false) {
      return `<button class="action ${on ? "on" : ""}" data-action="${action}" data-id="${id}"

      </button>`;

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        const video = entry.target;
        if (entry.isIntersecting && !$("#modal").open && !document.hidden) {
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      });
    }, { threshold: 0.65 });

    function resumeVisibleVideo() {
      if ($("#modal").open || document.hidden) return;
      document.querySelectorAll(".media video").forEach(video => {
        const rect = video.getBoundingClientRect();
        const visible = Math.max(0, Math.min(rect.bottom, innerHeight) - Math.max(rect.top, 0));
        if (visible / rect.height >= .65) video.play().catch(() => {});
      });
    }

    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        document.querySelectorAll("video").forEach(video => video.pause());
      } else {
        resumeVisibleVideo();
      }
    });

    function updateMediaPreview(input) {
      releasePreview();
      const preview = $("#mediaPreview");
      const prompt = $("#mediaDropzonePrompt");
      const dropzone = $("#mediaDropzone");
      if (!preview) return;

      const file = input.files?.[0];
      if (!file) {
        preview.innerHTML = "";
        if (prompt) prompt.classList.remove("hidden");
        if (dropzone) dropzone.classList.remove("has-file");
        return;
      }

      const maxFileSize = 99 * 1024 * 1024;
      if (file.size > maxFileSize) {
        input.value = "";
        preview.innerHTML = "";
        if (prompt) prompt.classList.remove("hidden");
        if (dropzone) dropzone.classList.remove("has-file");
        toast("Dosya en fazla 99 MB olmalı. Form için ek alan ayrılır.");
        return;
      }

      const ext = file.name.split(".").pop()?.toLowerCase();
      const isImg = ["jpg", "jpeg", "png", "webp"].includes(ext);
      const isVid = ["mp4", "webm"].includes(ext);

      if (!isImg && !isVid) {
        input.value = "";
        preview.innerHTML = "";
        if (prompt) prompt.classList.remove("hidden");
        if (dropzone) dropzone.classList.remove("has-file");
        toast("JPG, PNG, WebP, MP4 veya WebM dosyası seç.");
        return;
      }

      previewURL = URL.createObjectURL(file);
      const mb = (file.size / (1024 * 1024)).toLocaleString("tr-TR", { maximumFractionDigits: 2 });

      if (prompt) prompt.classList.add("hidden");
      if (dropzone) dropzone.classList.add("has-file");

      preview.innerHTML = `
        <div class="preview-card">
          <div class="preview-media-box">
            ${isVid
              ? `<video src="${previewURL}" controls muted playsinline preload="metadata"></video>`
              : `<img src="${previewURL}" alt="Önizleme">`
            }
          </div>
          <div class="preview-info-row">
            <div class="preview-name-col">
              ${icon(isVid ? "video" : "image")}
              <div>
                <strong>${esc(file.name)}</strong>
                <small>${mb} MB · ${isVid ? "Video" : "Fotoğraf"}</small>
              </div>
            </div>
            <button type="button" class="preview-clear-btn" data-action="clear-media-file" title="Dosyayı kaldır">
              ${icon("trash")} <span>Kaldır</span>
            </button>
          </div>
        </div>
      `;
    }

    function clearMediaSelection() {

    function updateAvatarPreview(input) {

    function initDropzoneListeners() {
      const mediaDz = $("#mediaDropzone");
      const mediaInput = $("#mediaInput");
      if (mediaDz && mediaInput) {
        ["dragenter", "dragover"].forEach(evt => {
          mediaDz.addEventListener(evt, e => {
            e.preventDefault();
            e.stopPropagation();
            mediaDz.classList.add("dragover");
          });
        });
        ["dragleave", "drop"].forEach(evt => {
          mediaDz.addEventListener(evt, e => {
            e.preventDefault();
            e.stopPropagation();
            mediaDz.classList.remove("dragover");
          });
        });
        mediaDz.addEventListener("drop", e => {
          const dt = e.dataTransfer;
          if (dt?.files && dt.files.length > 0) {
            mediaInput.files = dt.files;
            updateMediaPreview(mediaInput);
          }
        });
      }

      const avatarDz = $("#avatarDropzone");
      const avatarInput = $("#avatarInput");
      if (avatarDz && avatarInput) {
        ["dragenter", "dragover"].forEach(evt => {
          avatarDz.addEventListener(evt, e => {
            e.preventDefault();
            e.stopPropagation();
            avatarDz.classList.add("dragover");
          });
        });
        ["dragleave", "drop"].forEach(evt => {
          avatarDz.addEventListener(evt, e => {
            e.preventDefault();
            e.stopPropagation();
            avatarDz.classList.remove("dragover");
          });
        });
        avatarDz.addEventListener("drop", e => {
          const dt = e.dataTransfer;
          if (dt?.files && dt.files.length > 0) {
            avatarInput.files = dt.files;
            updateAvatarPreview(avatarInput);
          }
        });
      }
    }

    /*
     * DOSYA YÜKLEME
     *
     * XMLHttpRequest, yükleme ilerlemesini gösterebilmek için kullanılır.
     * Diğer API işlemleri api() üzerinden fetch ile devam eder.
     */
    function uploadForm(url, formData, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();

        xhr.open("POST", url, true);
        xhr.withCredentials = true;
        xhr.timeout = 10 * 60 * 1000;
        xhr.setRequestHeader("X-CSRF-Token", csrf);

        xhr.upload.addEventListener("progress", event => {
          if (!event.lengthComputable) return;

          const percentage = Math.min(
            100,
            Math.round((event.loaded / event.total) * 100)
          );

          onProgress?.(percentage);
        });

        xhr.addEventListener("load", () => {
          let result = {};

          try {
            result = JSON.parse(xhr.responseText || "{}");
          } catch {
            reject(
              new Error("Sunucudan geçerli bir yanıt alınamadı.")
            );
            return;
          }

          if (result.csrf) csrf = result.csrf;

          if (xhr.status >= 200 && xhr.status < 300) {
            resolve(result);
          } else {
            reject(
              new Error(
                result.error || `Yükleme başarısız (${xhr.status}).`
              )
            );
          }
        });

        xhr.addEventListener("error", () => {
          reject(
            new Error(
              "Yükleme sırasında bağlantı kesildi. Sunucuyu ve bağlantını kontrol et."
            )
          );
        });

        xhr.addEventListener("timeout", () => {
          reject(
            new Error(
              "Yükleme zaman aşımına uğradı. Daha küçük bir dosyayla tekrar dene."
            )
          );
        });

        xhr.addEventListener("abort", () => {
          reject(new Error("Yükleme iptal edildi."));
        });

        xhr.send(formData);
      });
    }

    /*
     * TEKRARLANAN İŞLEMLERİ ENGELLEME
     *
     * Aynı düğmeye peş peşe basıldığında aynı isteğin birden fazla
     * kez gönderilmesini önler.
     */
    async function runAction(key, button, operation) {
      if (pendingActions.has(key)) return;

      pendingActions.add(key);

      const wasDisabled = button?.disabled ?? false;
      if (button) button.disabled = true;

      try {
        return await operation();
      } finally {
        pendingActions.delete(key);

        if (button?.isConnected) {
          button.disabled = wasDisabled;
        }
      }
    }

    /*
     * PAYLAŞIM BAĞLANTILARI
     *
     * Her paylaşım aynı HTML sayfası üzerinden ?post=ID ile açılır.
     */
    function getPostURL(id) {
      const url = new URL("/", window.location.origin);
      url.searchParams.set("post", String(id));
      return url.toString();
    }

    async function sharePost(id) {
      openShareModal(id);
    }

    function focusPostFromURL() {
      const params = new URLSearchParams(window.location.search);
      const rawId = params.get("post");

      if (!rawId) return;

      const id = Number(rawId);

      if (!Number.isSafeInteger(id) || id < 1) {
        toast("Paylaşım bağlantısı geçerli değil.");
        return;
      }

      const post = postById(id);

      if (!post) {
        toast("Bu paylaşım bulunamadı veya silinmiş.");
        return;
      }

      route = "home";
      profileId = null;
      query = "";
      $("#search").value = "";
      render();

      requestAnimationFrame(() => {
        const element = document.getElementById(`post-${id}`);

        if (!element) return;

        element.style.scrollMarginTop = "105px";
        element.scrollIntoView({
          behavior: "instant",
          block: "start"
        });

        if (post.locked) {
          toast("Bu özel paylaşımı görmek için demo erişimi aç.");
        }
      });
    }

    /*
     * MERKEZİ TIKLAMA YÖNETİMİ
     */
    document.addEventListener("click", async event => {
      if (!(event.target instanceof Element)) return;

      // Medya alanına tıklanıldığında büyük önizleme penceresini aç
      const mediaTarget = event.target.closest(".media");
      if (mediaTarget && !event.target.closest("button, input, textarea, a, .actions, .volume-control, .volume-slider-wrap, .pill")) {
        const postCardEl = mediaTarget.closest(".post");
        if (postCardEl) {
          const postId = Number(postCardEl.dataset.post);
          const post = postById(postId);
          if (post) {
            if (post.locked) openCheckout(postId);
            else openPreviewModal(postId);
            return;
          }
        }
      }

      const button = event.target.closest("[data-action], [data-route]");
      if (!button) return;

      if (button instanceof HTMLButtonElement && button.disabled) {
        return;
      }

      const nextRoute = button.dataset.route;

      if (nextRoute) {
        event.preventDefault();
        navigate(nextRoute);
        return;
      }

      const action = button.dataset.action;
      const id = Number(button.dataset.id);

      // Video tıklamasının kendi doğal etkileşimini gereksiz yere engelleme.
      if (action !== "video") {
        event.preventDefault();
      }

      try {
        switch (action) {
          case "close":
            closeModal();
            break;

          case "login":
          case "auth-login":
            openAuth("login");
            break;

          case "auth-register":
            openAuth("register");
            break;

          case "my-profile":
            if (needLogin()) {
              navigate("profile", state.me.id);
            }
            break;

          case "profile":
            if (author(id)) {
              navigate("profile", id);
            } else {
              toast("Profil bulunamadı.");
            }
            break;

          case "view-avatar":
            if (id) {
              openAvatarModal(id);
            }
            break;

          case "admin":
            openAdmin();
            break;

          case "admin-tab":
          case "studio-tab":
            adminTab = button.dataset.tab;
            if (route === "admin") {
              render();
            } else {
              openAdmin(button.dataset.tab);
            }
            break;

          case "clear-media-file":
            clearMediaSelection();
            break;

          case "logout":
            await runAction("logout", button, async () => {
              await api("/api/logout", {
                method: "POST",
                data: {}
              });

              if ($("#modal").open) closeModal();

              route = "home";
              profileId = null;
              query = "";
              $("#search").value = "";

              // Önceki kullanıcının yetkili medya görünümünü hemen kaldır.
              state = { me: null, profiles: [], posts: [] };
              render();

              await loadState();
              toast("Hesabından çıkış yaptın.");
            });
            break;

          case "follow":
            if (!needLogin()) return;

            await runAction(`follow:${id}`, button, async () => {
              const target = author(id);
              const wasFollowing = Boolean(target?.following);

              await api(`/api/follow/${id}`, {
                method: "POST",
                data: {}
              });

              await loadState(true);

              toast(
                wasFollowing
                  ? "Takipten çıkarıldı."
                  : "Takip etmeye başladın."
              );
            });
            break;

          case "like":
          case "save":
            if (!needLogin()) return;

            await runAction(`${action}:${id}`, button, async () => {
              const post = postById(id);
              if (!post) return;

              if (action === "like" && post.locked) {
                openCheckout(id);
                return;
              }

              const wasSaved = post.saved;

              if (activePreviewId === id && $("#previewModal")?.open) {
                if (action === "like") {
                  post.liked = !post.liked;
                  post.likes = Math.max(0, post.likes + (post.liked ? 1 : -1));
                } else if (action === "save") {
                  post.saved = !post.saved;
                }
                updateLightboxActions(post);
              }

              await api(`/api/post/${id}/${action}`, {
                method: "POST",
                data: {}
              });

              await loadState(true);

              if (action === "save") {
                toast(
                  wasSaved
                    ? "Kaydedilenlerden kaldırıldı."
                    : "Kaydedilenlere eklendi."
                );
              }
            });
            break;

          case "comments":
            await openComments(id);
            break;

          case "unlock":
            openCheckout(id);
            break;

          case "confirm-unlock":
            if (!needLogin()) return;

            await runAction(`unlock:${id}`, button, async () => {
              const originalHTML = button.innerHTML;
              button.textContent = "Demo erişim açılıyor...";

              try {
                const result = await api(`/api/unlock/${id}`, {
                  method: "POST",
                  data: {
                    confirm_simulation: true
                  }
                });

                closeModal();
                await loadState(true);

                toast(
                  result.message || "Demo erişim açıldı. Para çekilmedi."
                );

                requestAnimationFrame(() => {
                  const element = document.getElementById(`post-${id}`);

                  if (!element) return;

                  element.style.scrollMarginTop = "105px";
                  element.scrollIntoView({
                    behavior: window.matchMedia(
                      "(prefers-reduced-motion: reduce)"
                    ).matches ? "instant" : "smooth",
                    block: "start"
                  });
                });
              } finally {
                if (button.isConnected) {
                  button.innerHTML = originalHTML;
                }
              }
            });
            break;

          case "preview":
            openPreviewModal(id);
            break;

          case "close-preview":
            closePreviewModal();
            break;

          case "copy-share-url": {
            const url = button.dataset.url || $("#shareLinkInput")?.value;
            if (url) {
              if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(url).catch(() => {});
              }
              const input = $("#shareLinkInput");
              if (input) {
                input.focus();
                input.select();
              }
              const originalHTML = button.innerHTML;
              button.innerHTML = `${icon("check")} <span>Kopyalandı!</span>`;
              button.style.filter = "brightness(1.2)";
              setTimeout(() => {
                if (button.isConnected) {
                  button.innerHTML = originalHTML;
                  button.style.filter = "";
                }
              }, 2000);
              toast("Bağlantı panoya kopyalandı!");
            }
            break;
          }

          case "preview-play-toggle": {
            if (previewVideo) {
              if (previewVideo.paused) {
                previewVideo.play().then(() => {
                  $("#lightboxPlayBtn").innerHTML = icon("play");
                }).catch(() => {});
              } else {
                previewVideo.pause();
                $("#lightboxPlayBtn").innerHTML = icon("play");
              }
            }
            break;
          }

          case "preview-mute-toggle": {
            toggleGlobalMute();
            break;
          }

          case "preview-fullscreen": {
            const wrap = document.querySelector(".lightbox-media-wrap");
            if (wrap) {
              if (!document.fullscreenElement) {
                wrap.requestFullscreen().catch(() => {});
              } else {
                document.exitFullscreen().catch(() => {});
              }
            }
            break;
          }

          case "preview-comments-focus": {
            document.querySelector("#lightboxCommentForm input")?.focus();
            break;
          }

          case "share":
            openShareModal(id);
            break;

          case "select-share-link": {
            const input = $("#shareLinkInput");
            input?.focus();
            input?.select();
            input?.setSelectionRange(0, input.value.length);
            break;
          }

          case "video": {
            openPreviewModal(id);
            break;
          }

          case "mute": {
            toggleGlobalMute();
            break;
          }

          case "delete-post":
            if (!state.me?.is_admin) {
              toast("Bu işlem yönetici yetkisi gerektirir.");
              return;
            }

            if (!window.confirm(
              "Bu paylaşım kalıcı olarak silinecek. " +
              "Beğeniler, yorumlar ve erişim kayıtları da silinir. Devam edilsin mi?"
            )) {
              return;
            }

            await runAction(`delete:${id}`, button, async () => {
              await api(`/api/admin/posts/${id}`, {
                method: "DELETE"
              });

              await loadState(true);
              if (route === "admin") {
                render();
              } else {
                openAdmin("manage");
              }

              toast("Paylaşım ve medya dosyası silindi.");
            });
            break;

          case "reply-comment": {
            if (!needLogin()) return;
            const commentId = Number(button.dataset.id);
            const username = button.dataset.username;
            const target = button.dataset.target;
            if (!commentId || !username) return;

            if (target === "lightbox") {
              activeLightboxReplyParent = { id: commentId, username };
              const wrap = $("#lightboxReplyBarWrap");
              if (wrap) {
                wrap.innerHTML = `
                  <div class="reply-bar">
                    <span><strong>@${esc(username)}</strong> adlı kullanıcıya yanıt veriyorsun</span>
                    <button type="button" class="reply-cancel-btn" data-action="cancel-reply" data-target="lightbox" aria-label="Yanıtı iptal et">✕ İptal</button>
                  </div>
                `;
              }
              const input = $("#lightboxCommentInput");
              if (input) {
                input.placeholder = `@${username} yanıtla...`;
                input.focus();
              }
            } else {
              activeReplyParent = { id: commentId, username };
              const wrap = $("#modalReplyBarWrap");
              if (wrap) {
                wrap.innerHTML = `
                  <div class="reply-bar">
                    <span><strong>@${esc(username)}</strong> adlı kullanıcıya yanıt veriyorsun</span>
                    <button type="button" class="reply-cancel-btn" data-action="cancel-reply" data-target="modal" aria-label="Yanıtı iptal et">✕ İptal</button>
                  </div>
                `;
              }
              const textarea = $("#commentFormBody");
              if (textarea) {
                textarea.placeholder = `@${username} için yanıtın...`;
                textarea.focus();
              }
            }
            break;
          }

          case "cancel-reply": {
            const target = button.dataset.target;
            if (target === "lightbox") {
              activeLightboxReplyParent = null;
              const wrap = $("#lightboxReplyBarWrap");
              if (wrap) wrap.innerHTML = "";
              const input = $("#lightboxCommentInput");
              if (input) input.placeholder = "Yorum yaz...";
            } else {
              activeReplyParent = null;
              const wrap = $("#modalReplyBarWrap");
              if (wrap) wrap.innerHTML = "";
              const textarea = $("#commentFormBody");
              if (textarea) textarea.placeholder = "Sohbete katıl...";
            }
            break;
          }

          case "delete-comment": {
            if (!needLogin()) return;
            const commentId = Number(button.dataset.id);
            const postId = Number(button.dataset.postId) || activeComments || activePreviewId;
            if (!commentId) return;

            if (!window.confirm("Bu yorumu silmek istediğine emin misin?")) {
              return;
            }

            await runAction(`delete-comment:${commentId}`, button, async () => {
              const res = await api(`/api/comments/${commentId}`, { method: "DELETE" });
              const targetPostId = res.post_id || postId;

              if (activeComments === targetPostId && $("#modal").open) {
                const refreshed = await api(`/api/comments/${targetPostId}`);
                renderComments(refreshed.comments, targetPostId);
              }

              if (activePreviewId === targetPostId && $("#previewModal")?.open) {
                const refreshed = await api(`/api/comments/${targetPostId}`);
                renderLightboxComments(refreshed.comments, targetPostId);
              }

              await loadState(true);
              toast("Yorum silindi.");
            });
            break;
          }

          case "retry-load":
            await runAction("retry-load", button, async () => {
              await loadState();
              focusPostFromURL();
            });
            break;
        }
      } catch (error) {
        console.error(error);
        toast(error.message || "İşlem sırasında bir hata oluştu.");
      }
    });

    /*
     * FORM İŞLEMLERİ
     */
    document.addEventListener("submit", async event => {
      const form = event.target;

      if (!(form instanceof HTMLFormElement)) return;

      const supportedForms = new Set([
        "authForm",
        "profileForm",
        "postForm",
        "commentForm",
        "lightboxCommentForm"
      ]);

      if (!supportedForms.has(form.id)) return;

      event.preventDefault();

      if (!form.reportValidity()) return;

      const key = `submit:${form.id}`;
      if (pendingActions.has(key)) return;

      pendingActions.add(key);

      const submitButton = form.querySelector('[type="submit"]');
      const originalHTML = submitButton?.innerHTML;

      if (submitButton) {
        submitButton.disabled = true;
        submitButton.textContent = "İşleniyor...";
      }

      let writingCompleted = false;

      try {
        if (form.id === "authForm") {
          const mode = authMode;
          const values = Object.fromEntries(new FormData(form).entries());

          await api(
            mode === "register" ? "/api/register" : "/api/login",
            {
              method: "POST",
              data: values
            }
          );

          writingCompleted = true;
          closeModal();
          await loadState();

          toast(
            mode === "register"
              ? "Hesabın oluşturuldu. LOOP'a hoş geldin."
              : "Giriş başarılı."
          );

          focusPostFromURL();
        }

        if (form.id === "profileForm") {
          if (!state.me?.is_admin) {
            throw new Error("Profil oluşturmak için yönetici olmalısın.");
          }

          const formData = new FormData(form);
          const avatarFile = formData.get("avatar");

          if (
            avatarFile instanceof File &&
            avatarFile.size > 99 * 1024 * 1024
          ) {
            throw new Error("Profil fotoğrafı en fazla 99 MB olmalı.");
          }

          await uploadForm("/api/admin/profiles", formData);

          writingCompleted = true;
          form.reset();
          releaseAvatarPreview();

          await loadState(true);

          if (route === "admin") {
            render();
          } else if (form.isConnected && $("#modal").open) {
            openAdmin("profiles");
          }

          toast("Yeni profil oluşturuldu. İçerik yüklerken seçebilirsin.");
        }

        if (form.id === "postForm") {
          if (!state.me?.is_admin) {
            throw new Error("İçerik yüklemek için yönetici olmalısın.");
          }

          const formData = new FormData(form);
          const file = formData.get("media");

          if (!(file instanceof File) || !file.name || file.size === 0) {
            throw new Error("Boş olmayan bir fotoğraf veya video seç.");
          }

          if (file.size > 99 * 1024 * 1024) {
            throw new Error(
              "Dosya en fazla 99 MB olmalı. Form verileri için ek alan ayrılır."
            );
          }

          const premium = form.querySelector('[name="premium"]').checked;

          // İşaretlenmemiş checkbox normalde FormData'ya eklenmez.
          // Sunucuya her durumda açık bir değer gönderiyoruz.
          formData.set("premium", premium ? "1" : "0");

          if (!premium) {
            formData.set("price", "49");
          }

          const status = form.querySelector("#uploadStatus");

          if (status) {
            status.classList.remove("hidden");
            status.textContent = "Dosya yükleniyor: %0";
          }

          await uploadForm(
            "/api/admin/posts",
            formData,
            percentage => {
              if (!status?.isConnected) return;

              status.textContent = percentage < 100
                ? `Dosya yükleniyor: %${percentage}`
                : "Dosya gönderildi. Sunucu paylaşımı kaydediyor...";
            }
          );

          writingCompleted = true;
          form.reset();
          releasePreview();

          if (form.isConnected && $("#modal").open) {
            closeModal();
          }

          await loadState();

          if (route === "admin") {
            adminTab = "manage";
            render();
            window.scrollTo({
              top: 0,
              behavior: "instant"
            });
          } else {
            route = "home";
            profileId = null;
            query = "";
            $("#search").value = "";
            render();
            window.scrollTo({
              top: 0,
              behavior: "instant"
            });
          }

          toast(
            premium
              ? "Özel içerik yayınlandı."
              : "Paylaşım yayınlandı."
          );
        }

        if (form.id === "commentForm") {
          const postId = activeComments;

          if (!state.me) {
            throw new Error("Yorum yazmak için giriş yapmalısın.");
          }

          if (!postId) {
            throw new Error("Yorum yapılacak paylaşım bulunamadı.");
          }

          const values = new FormData(form);
          const body = String(values.get("body") || "").trim();
          const as_user_id = values.get("as_user_id");
          const parent_id = activeReplyParent ? activeReplyParent.id : null;

          if (!body) {
            throw new Error("Yorum alanını boş bırakamazsın.");
          }

          const result = await api(`/api/comments/${postId}`, {
            method: "POST",
            data: { body, as_user_id, parent_id }
          });

          writingCompleted = true;
          activeReplyParent = null;

          // İstek sürerken başka bir pencereye geçilmiş olabilir.
          if (
            activeComments === postId &&
            $("#modal").open &&
            form.isConnected
          ) {
            renderComments(result.comments, postId);
          }

          await loadState(true);
          toast(parent_id ? "Yanıtın eklendi." : "Yorumun eklendi.");
        }

        if (form.id === "lightboxCommentForm") {
          const postId = activePreviewId;

          if (!state.me) {
            throw new Error("Yorum yazmak için giriş yapmalısın.");
          }

          if (!postId) {
            throw new Error("Yorum yapılacak paylaşım bulunamadı.");
          }

          const values = new FormData(form);
          const body = String(values.get("body") || "").trim();
          const as_user_id = values.get("as_user_id");
          const parent_id = activeLightboxReplyParent ? activeLightboxReplyParent.id : null;

          if (!body) {
            throw new Error("Yorum alanını boş bırakamazsın.");
          }

          const result = await api(`/api/comments/${postId}`, {
            method: "POST",
            data: { body, as_user_id, parent_id }
          });

          writingCompleted = true;
          activeLightboxReplyParent = null;
          form.reset();
          const wrap = $("#lightboxReplyBarWrap");
          if (wrap) wrap.innerHTML = "";
          const input = $("#lightboxCommentInput");
          if (input) input.placeholder = "Yorum yaz...";
          await loadState(true);

          if (activePreviewId === postId && $("#previewModal")?.open) {
            renderLightboxComments(result.comments, postId);
          }

          toast(parent_id ? "Yanıtın eklendi." : "Yorumun eklendi.");
        }
      } catch (error) {
        console.error(error);

        const message = writingCompleted
          ? "İşlem kaydedildi ancak ekran yenilenemedi. Sayfayı yenile; işlemi tekrar gönderme."
          : error.message || "İşlem tamamlanamadı.";

        const status = form.querySelector("#uploadStatus");

        if (status?.isConnected) {
          status.classList.remove("hidden");
          status.textContent = message;
        }

        toast(message);
      } finally {
        pendingActions.delete(key);

        if (submitButton?.isConnected) {
          submitButton.disabled = false;

          if (originalHTML !== undefined) {
            submitButton.innerHTML = originalHTML;
          }
        }
      }
    });

    /*
     * SES SEVİYESİ KAYDIRICILARI
     */
    document.addEventListener("input", event => {
      const target = event.target;
      if (target instanceof HTMLInputElement && target.classList.contains("volume-slider")) {
        const val = parseFloat(target.value);
        setGlobalVolume(val, val === 0);
      }
    });

    /*
     * ARAMA
     *
     * Her tuşta bütün akışı yeniden çizmek yerine kısa bir bekleme
     * kullanılır. Arama mevcut bölümün içerikleri üzerinde çalışır.
     */
    let searchTimer;

    $("#search").addEventListener("input", event => {
      const value = event.target.value;

      clearTimeout(searchTimer);

      searchTimer = setTimeout(() => {
        query = value.trim();
        if (query && route === "admin" && adminTab !== "manage") {
          adminTab = "manage";
        }
        render();
      }, 180);
    });

    /*
     * KLAVYEYLE VİDEO KONTROLÜ
     *
     * Space: Ekranda en fazla görünen videoyu oynat/duraklat.
     * M: Aynı videonun sesini aç/kapat.
     *
     * Form alanlarında veya etkileşimli öğelerde yazarken devreye girmez.
     */
    document.addEventListener("keydown", event => {
      if ($("#modal").open || $("#previewModal")?.open || event.repeat) return;
      if (event.ctrlKey || event.metaKey || event.altKey) return;
      if (!(event.target instanceof Element)) return;

      if (
        event.target.closest(
          "input, textarea, select, button, a, " +
          "[contenteditable]:not([contenteditable='false'])"
        )
      ) {
        return;
      }

      const isSpace = event.code === "Space";
      const isMute = event.key.toLowerCase() === "m";

      if (!isSpace && !isMute) return;

      const candidates = [...document.querySelectorAll(".media video")]
        .map(video => {
          const rect = video.getBoundingClientRect();

          const visible = Math.max(
            0,
            Math.min(rect.bottom, window.innerHeight) -
            Math.max(rect.top, 0)
          );

          return {
            video,
            visible
          };
        })
        .filter(item => item.visible > 0)
        .sort((a, b) => b.visible - a.visible);

      const video = candidates[0]?.video;
      if (!video) return;

      event.preventDefault();

      if (isSpace) {
        if (video.paused) {
          document.querySelectorAll(".media video").forEach(other => {
            if (other !== video) other.pause();
          });

          video.play().catch(() => {
            toast("Video oynatılamadı.");
          });
        } else {
          video.pause();
        }
      }

      if (isMute) {
        toggleGlobalMute();
      }
    });

    /*
     * SAYFA YAŞAM DÖNGÜSÜ
     */
    window.addEventListener("pagehide", () => {
      document.querySelectorAll("video").forEach(video => {
        video.pause();
      });
    });

    window.addEventListener("pageshow", event => {
      if (!event.persisted) return;

      // Tarayıcı geri/ileri önbelleğinden döndüğünde yetkileri yenile.
      loadState(true).catch(error => {
        console.error(error);
        toast("Oturum durumu yenilenemedi. Sayfayı yenile.");
      });
    });

    window.addEventListener("popstate", () => {
      const params = new URLSearchParams(window.location.search);

      if (params.has("post")) {
        focusPostFromURL();
      } else {
        navigate("home");
      }
    });

    /*
     * İLK YÜKLEME
     */
    async function bootstrap() {
      try {
        setGlobalVolume(globalVolume, globalMuted);
        await loadState();
        focusPostFromURL();
      } catch (error) {
        console.error(error);

        $("#feed").innerHTML = `
          <div class="empty">
            ${icon("grid")}

            <h2>Akış yüklenemedi.</h2>

            <p>
              ${esc(
                error.message ||
                "Sunucu bağlantısını kontrol ederek tekrar dene."
              )}
            </p>

            <button
              class="btn primary"
              data-action="retry-load"
            >
              Tekrar dene
            </button>
          </div>
        `;

        toast("Sunucuya bağlanılamadı.");
      }
    }

    bootstrap();
  </script>
</body>
</html>
