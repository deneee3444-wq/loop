<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>LOOP - Sana ait bir akış</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23f43f5e'/%3E%3Cstop offset='100%25' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpolygon points='13,9 23,16 13,23' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --bg: #09090b;
      --panel: #121217;
      --panel2: #181824;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.16);
      --text: #f4f4f5;
      --text-dim: #d4d4d8;
      --muted: #a1a1aa;
      --pink: #f43f5e;
      --purple: #8b5cf6;
      --cyan: #06b6d4;
      --indigo: #6366f1;
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #272733; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f50; }
    * { scrollbar-width: thin; scrollbar-color: #272733 #09090b; }

    body {
      margin: 0;
      background: radial-gradient(circle 900px at 50% -150px, rgba(139, 92, 246, 0.12), transparent 70%), var(--bg);
      color: var(--text);
      font: 14px/1.5 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    button, input, textarea, select { font: inherit; outline: none !important; }
    button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    input:focus, textarea:focus, select:focus,
    input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: none !important;
      box-shadow: none;
    }
    :focus-visible { outline: none; }
    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--purple);
      outline-offset: 2px;
    }
    a { color: inherit; text-decoration: none; }
    button { color: inherit; }
    svg { width: 22px; height: 22px; flex-shrink: 0; }
    [data-icon] { display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
    h1, h2, h3, p { margin-top: 0; }
    small, .muted { color: var(--muted); }
    .hidden { display: none !important; }

    .shell {
      max-width: 1600px;
      margin: auto;
      display: grid;
      grid-template-columns: 245px minmax(0, 1fr) 295px;
      min-height: 100dvh;
    }

    .sidebar {
      height: 100dvh;
      position: sticky;
      top: 0;
      padding: 32px 23px 22px;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 28px;
      font-weight: 850;
      letter-spacing: -1.2px;
      margin-bottom: 37px;
    }
    .brand-mark {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      box-shadow: 0 5px 28px #ff416d25;
      transform: rotate(-8deg);
      transition: transform .2s ease;
    }
    .brand:hover .brand-mark { transform: rotate(0deg) scale(1.05); }
    .brand-mark svg { transform: rotate(8deg); }
    .brand:hover .brand-mark svg { transform: rotate(0deg); }
    .nav { display: grid; gap: 7px; }
    .nav button {
      border: 0;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 14px;
      border-radius: 13px;
      text-align: left;
      color: #ababbd;
      font-weight: 650;
      transition: background .15s, color .15s, transform .12s;
    }
    .nav button:hover { background: #ffffff0a; color: white; transform: translateX(3px); }
    .nav button:active { transform: scale(.98); }
    .nav button.active {
      color: var(--pink);
      background: linear-gradient(90deg, #ff416d19, #ff416d05);
      transform: none;
    }
    .side-label {
      color: #656578;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 10px;
      font-weight: 800;
      margin: 30px 13px 12px;
    }
    .side-bottom { margin-top: auto; padding-top: 25px; }
    .account-card {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 8px 0;
    }
    .account-info-btn {
      min-width: 0;
      flex: 1;
      border: 0;
      background: transparent;
      text-align: left;
      padding: 0;
      cursor: pointer;
      color: inherit;
    }
    .account-info-btn strong, .account-info-btn small {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .account-info-btn strong { font-size: 13px; }
    .account-info-btn small { font-size: 11px; color: var(--muted); }

    .main { min-width: 0; padding: 0 30px 30px; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      background: rgba(9, 9, 11, 0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
    }
    .tabs { display: flex; align-items: center; gap: 23px; }
    .tab {
      position: relative;
      padding: 27px 0;
      border: 0;
      background: transparent;
      font-weight: 600;
      font-size: 14px;
      color: var(--muted);
      white-space: nowrap;
      transition: color .15s;
    }
    .tab:hover { color: #f4f4f5; }
    .tab.active { color: #ffffff; font-weight: 700; }
    .tab.active::after {
      content: "";
      position: absolute;
      bottom: 14px;
      left: 15%;
      width: 70%;
      height: 3px;
      border-radius: 9999px;
      background: linear-gradient(90deg, var(--pink), var(--purple));
      box-shadow: 0 0 12px rgba(244, 63, 94, 0.6);
    }
    .search {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      border-radius: 9999px;
      padding: 8px 16px;
      max-width: 250px;
      color: var(--muted);
      transition: all .24s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .search:focus-within {
      border-color: rgba(139, 92, 246, 0.7);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.22), 0 8px 24px rgba(0, 0, 0, 0.35);
      background: rgba(22, 22, 32, 0.95);
      color: #ffffff;
      max-width: 310px;
    }
    .search svg {
      width: 16px;
      height: 16px;
      color: var(--muted);
      transition: color .2s ease;
    }
    .search:focus-within svg {
      color: var(--pink);
    }
    .search input,
    .search input:focus,
    .search input:focus-visible {
      width: 100%;
      background: none !important;
      border: 0 !important;
      color: white;
      min-width: 0;
      font-size: 13px;
      outline: none !important;
      box-shadow: none !important;
      padding: 0;
    }

    .feed-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 24px 0 20px;
    }
    .eyebrow {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--pink);
      text-transform: uppercase;
    }
    .feed-heading h1 { font-size: 24px; font-weight: 800; letter-spacing: -.7px; margin: 4px 0; color: #fafafa; }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 12px;
      border: 1px solid var(--line);
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      color: #e4e4e7;
      white-space: nowrap;
    }
    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--cyan);
    }
    .stories {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding: 6px 2px 20px;
      scrollbar-width: none;
    }
    .stories::-webkit-scrollbar { display: none; }
    .story {
      flex: 0 0 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      transition: transform .18s ease;
    }
    .story:hover { transform: translateY(-3px); }
    .story:active { transform: scale(.95); }
    .story-ring {
      width: 66px;
      height: 66px;
      min-width: 66px;
      min-height: 66px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      padding: 2.5px;
      background: linear-gradient(135deg, var(--pink), var(--purple), var(--cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 7px;
      flex-shrink: 0;
      box-sizing: border-box;
      overflow: hidden;
      transition: box-shadow .2s ease, transform .2s ease;
    }
    .story:hover .story-ring {
      box-shadow: 0 0 18px rgba(244, 63, 94, 0.45);
      transform: scale(1.04);
    }
    .story .avatar {
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      border-radius: 50%;
      border: 2px solid var(--bg);
      font-size: 24px !important;
      aspect-ratio: 1 / 1;
      box-sizing: border-box;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      line-height: 1 !important;
      overflow: hidden;
    }
    .story-username,
    .story > span:last-child {
      display: block;
      width: 68px;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 11px;
      font-weight: 500;
      color: #d4d4d8;
      white-space: nowrap;
      text-align: center;
    }
    .avatar {
      width: 40px;
      height: 40px;
      min-width: 40px;
      min-height: 40px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      object-fit: cover;
      box-sizing: border-box;
      line-height: 1;
      overflow: hidden;
      user-select: none;
      text-align: center;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .avatar:hover {
      transform: scale(1.04);
    }
    .avatar.avatar-fallback, span.avatar {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #ffffff;
      font-weight: 800;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 0;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      overflow: hidden;
      margin: 0;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      text-align: center;
    }
    .story .avatar.avatar-fallback, .story span.avatar {
      font-size: 24px !important;
      width: 100% !important;
      height: 100% !important;
      line-height: 1 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .account-card .avatar {
      width: 40px;
      height: 40px;
      min-width: 40px;
      min-height: 40px;
      font-size: 16px;
    }
    .creator .avatar {
      width: 38px;
      height: 38px;
      min-width: 38px;
      min-height: 38px;
      font-size: 14px;
    }
    .profile-banner .avatar {
      width: 80px;
      height: 80px;
      min-width: 80px;
      min-height: 80px;
      font-size: 30px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
    }
    .comment .avatar {
      width: 32px;
      height: 32px;
      min-width: 32px;
      min-height: 32px;
      font-size: 13px;
    }
    .comment-reply .avatar {
      width: 26px;
      height: 26px;
      min-width: 26px;
      min-height: 26px;
      font-size: 11px;
    }

    .feed { display: grid; gap: 27px; }
    .post {
      max-width: 490px;
      width: 100%;
      margin: 0 auto 32px auto;
      display: flex;
      flex-direction: column;
    }
    .post-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 2px 10px;
      width: 100%;
      box-sizing: border-box;
    }
    .profile-link {
      display: flex;
      align-items: center;
      gap: 11px;
      background: none;
      border: 0;
      padding: 0;
      text-align: left;
      min-width: 0;
      flex: 1;
    }
    .post-user strong, .post-user small { display: block; }
    .post-user strong { font-size: 13px; }
    .post-user small { font-size: 11px; color: var(--muted); }
    .post-head > .btn {
      margin-left: auto;
      flex-shrink: 0;
    }

    .media {
      position: relative;
      aspect-ratio: 9 / 13;
      max-height: 720px;
      overflow: hidden;
      background: #0f0f16;
      border: 1px solid #ffffff0f;
      border-radius: var(--radius);
      isolation: isolate;
      box-shadow: 0 12px 40px #00000045;
      cursor: pointer;
      transition: border-color .2s, box-shadow .2s;
    }
    .media:hover {
      border-color: #ffffff22;
      box-shadow: 0 16px 50px #00000070;
    }
    .media > img, .media > video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #06060a;
      transition: transform .25s ease;
    }
    .media:hover > img {
      transform: scale(1.015);
    }
    .media::after {
      content: "";
      position: absolute;
      inset: 40% 0 0;
      background: linear-gradient(transparent, #000000dc);
      pointer-events: none;
      z-index: 1;
    }
    .media-top {
      position: absolute;
      top: 17px;
      left: 17px;
      right: 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 3;
      pointer-events: none;
    }
    .media-top > * { pointer-events: auto; }
    .media-top .pill {
      background: #00000065;
      color: white;
      backdrop-filter: blur(10px);
      border-color: #ffffff26;
      font-size: 11px;
    }
    .media-top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-button {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      padding: 0;
      color: #d4d4d8;
      transition: transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
    }
    .icon-button:hover {
      transform: scale(1.06);
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.22);
      color: #ffffff;
    }
    .icon-button:active { transform: scale(0.94); }
    .icon-button svg { width: 18px; height: 18px; display: block; }
    .icon-button span[data-icon] { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; }

    .modal-close-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.07);
      color: #a1a1aa;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      cursor: pointer;
      transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
      flex-shrink: 0;
    }
    .modal-close-btn:hover {
      background: rgba(244, 63, 94, 0.18);
      color: #f43f5e;
      border-color: rgba(244, 63, 94, 0.45);
      transform: rotate(90deg) scale(1.06);
    }
    .modal-close-btn:active {
      transform: rotate(90deg) scale(0.93);
    }
    .modal-close-btn span, .modal-close-btn svg {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }


    .media-top .icon-button { background: #00000065; border-color: #ffffff20; }
    .media-top .icon-button:hover { background: #000000b0; }

    .volume-control {
      display: flex;
      align-items: center;
      background: #00000065;
      backdrop-filter: blur(12px);
      border: 1px solid #ffffff20;
      border-radius: 30px;
      padding: 0;
      transition: all .2s ease;
    }
    .volume-control:hover, .volume-control:focus-within {
      background: #000000aa;
      border-color: #ffffff35;
    }
    .volume-slider-wrap {
      display: flex;
      align-items: center;
      width: 0;
      overflow: hidden;
      opacity: 0;
      transition: width .22s cubic-bezier(0.4, 0, 0.2, 1), opacity .18s ease;
    }
    .volume-control:hover .volume-slider-wrap,
    .volume-control:focus-within .volume-slider-wrap,
    .volume-control.expanded .volume-slider-wrap {
      width: 68px;
      opacity: 1;
      margin-right: 8px;
    }
    .volume-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 14px;
      background: transparent !important;
      outline: none;
      cursor: pointer;
      margin: 0;
      padding: 0;
      border: none;
    }
    .volume-slider::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--pink) 0%, var(--pink) var(--vol-percent, 0%), rgba(255, 255, 255, 0.2) var(--vol-percent, 0%), rgba(255, 255, 255, 0.2) 100%);
      border: none;
      transition: background .12s ease;
    }
    .volume-control.is-muted .volume-slider::-webkit-slider-runnable-track {
      background: rgba(255, 255, 255, 0.18) !important;
    }
    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--pink);
      cursor: pointer;
      box-shadow: 0 0 6px rgba(244, 63, 94, 0.7);
      margin-top: -4px;
      transition: background .15s ease, box-shadow .15s ease, transform .15s ease;
    }
    .volume-slider:hover::-webkit-slider-thumb {
      transform: scale(1.15);
    }
    .volume-control.is-muted .volume-slider::-webkit-slider-thumb {
      background: #71717a !important;
      box-shadow: none !important;
      transform: none !important;
    }
    .volume-slider::-moz-range-track {
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(to right, var(--pink) 0%, var(--pink) var(--vol-percent, 0%), rgba(255, 255, 255, 0.2) var(--vol-percent, 0%), rgba(255, 255, 255, 0.2) 100%);
      border: none;
    }
    .volume-control.is-muted .volume-slider::-moz-range-track {
      background: rgba(255, 255, 255, 0.18) !important;
    }
    .volume-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--pink);
      cursor: pointer;
      border: none;
      box-shadow: 0 0 6px rgba(244, 63, 94, 0.7);
      transition: background .15s ease, box-shadow .15s ease;
    }
    .volume-control.is-muted .volume-slider::-moz-range-thumb {
      background: #71717a !important;
      box-shadow: none !important;
    }

    .preview-badge-btn {
      background: #00000065 !important;
      backdrop-filter: blur(10px);
      color: #fff;
    }
    .preview-badge-btn:hover {
      background: #000000bb !important;
      color: var(--pink);
    }

    .caption {
      position: absolute;
      bottom: 22px;
      left: 22px;
      right: 76px;
      z-index: 2;
      pointer-events: none;
      text-shadow: 0 1px 5px rgba(0,0,0,0.85);
    }
    .caption strong { font-size: 15px; }
    .caption p {
      margin: 6px 0 10px;
      font-size: 13px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      color: #f4f4fd;
    }
    .sound {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      opacity: .85;
    }
    .sound svg { width: 14px; height: 14px; }
    .actions {
      position: absolute;
      right: 13px;
      bottom: 20px;
      z-index: 3;
      display: grid;
      gap: 16px;
    }
    .action {
      border: 0;
      background: transparent;
      padding: 0;
      display: grid;
      justify-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 750;
      transition: transform .15s;
    }
    .action:active { transform: scale(0.92); }
    .action i {
      display: grid;
      place-items: center;
      border-radius: 50%;
      width: 43px;
      height: 43px;
      background: #25252b90;
      backdrop-filter: blur(10px);
      font-style: normal;
      transition: .18s;
      overflow: visible;
    }
    .action:hover i { transform: scale(1.08); background: #48484faa; }
    
    .action svg,
    .lightbox-actions-row .action svg {
      overflow: visible !important;
    }

    /* Like Active: Solid red filled heart */
    .action[data-action="like"]:hover { color: #fda4af; }
    .action.on[data-action="like"] {
      color: #f43f5e;
    }
    .action.on[data-action="like"] i {
      background: rgba(244, 63, 94, 0.22);
      box-shadow: 0 0 16px rgba(244, 63, 94, 0.55);
    }
    .action.on[data-action="like"] svg,
    .lightbox-actions-row .action.on[data-action="like"] svg {
      transform-origin: center center;
      animation: heartPulse .35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .action.on[data-action="like"] svg path,
    .lightbox-actions-row .action.on[data-action="like"] svg path {
      fill: #f43f5e !important;
      stroke: #f43f5e;
    }

    /* Save Active: Solid golden amber filled bookmark */
    .action[data-action="save"]:hover { color: #fde68a; }
    .action.on[data-action="save"] {
      color: #f59e0b;
    }
    .action.on[data-action="save"] i {
      background: rgba(245, 158, 11, 0.22);
      box-shadow: 0 0 16px rgba(245, 158, 11, 0.55);
    }
    .action.on[data-action="save"] svg,
    .lightbox-actions-row .action.on[data-action="save"] svg {
      transform-origin: center center;
      animation: heartPulse .35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .action.on[data-action="save"] svg path,
    .lightbox-actions-row .action.on[data-action="save"] svg path {
      fill: #f59e0b !important;
      stroke: #f59e0b;
    }

    /* Comment Hover & Active */
    .action[data-action="comments"]:hover,
    .action[data-action="preview-comments-focus"]:hover {
      color: #38bdf8;
    }
    .action[data-action="comments"]:hover i,
    .action[data-action="preview-comments-focus"]:hover i {
      background: rgba(56, 189, 248, 0.22);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    /* Share Hover & Active */
    .action[data-action="share"]:hover {
      color: #c084fc;
    }
    .action[data-action="share"]:hover i {
      background: rgba(192, 132, 252, 0.22);
      box-shadow: 0 0 12px rgba(192, 132, 252, 0.4);
    }

    @keyframes heartPulse {
      0% { transform: scale(1); }
      35% { transform: scale(1.26); }
      65% { transform: scale(0.96); }
      100% { transform: scale(1); }
    }
    .post-foot {
      display: flex;
      justify-content: space-between;
      color: #727286;
      font-size: 10px;
      padding: 10px 3px 0;
    }

    .locked-art {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 15%, #924b9b50, transparent 50%),
        radial-gradient(ellipse at 80% 85%, #3b50a755, transparent 55%),
        linear-gradient(155deg, #201627, #101421);
    }
    .locked-art::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .15;
      background-image:
        linear-gradient(#ffffff24 1px, transparent 1px),
        linear-gradient(90deg, #ffffff24 1px, transparent 1px);
      background-size: 45px 45px;
      transform: rotate(-12deg) scale(1.3);
    }
    .lock-card {
      position: absolute;
      z-index: 3;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 35px;
      text-align: center;
    }
    .lock-symbol {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      border-radius: 24px;
      border: 1px solid #ffffff25;
      background: #ffffff0a;
      box-shadow: 0 15px 60px #0005;
      margin-bottom: 22px;
      transform: rotate(-7deg);
    }
    .lock-symbol svg { width: 32px; height: 32px; transform: rotate(7deg); }
    .lock-card h2 { font-size: 26px; letter-spacing: -.8px; margin-bottom: 8px; }
    .lock-card p { color: #aca3bf; max-width: 250px; font-size: 13px; }
    .lock-card small { margin-top: 12px; font-size: 10px; }

    .btn {
      border: 1px solid var(--line);
      background: #181822;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: -0.01em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      white-space: nowrap;
      transition: all .16s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 1px 2px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .btn:hover {
      background: #232330;
      border-color: rgba(255, 255, 255, 0.18);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.1);
    }
    .btn:active { transform: scale(0.97); }
    .btn.primary {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      border-color: rgba(255,255,255,0.2);
      box-shadow: 0 4px 20px rgba(244, 63, 94, 0.35), inset 0 1px 0 rgba(255,255,255,0.25);
      color: #ffffff;
    }
    .btn.primary:hover {
      background: linear-gradient(135deg, #fb7185, #a78bfa);
      box-shadow: 0 6px 26px rgba(244, 63, 94, 0.45), inset 0 1px 0 rgba(255,255,255,0.3);
      filter: none;
    }
    .btn.small { font-size: 11px; padding: 6px 12px; border-radius: 8px; }
    .btn.ghost { background: transparent; border-color: var(--line); box-shadow: none; }
    .btn.ghost:hover { background: rgba(255,255,255,0.08); border-color: var(--line-strong); }
    .btn.danger { color: #fda4af; background: rgba(244, 63, 94, 0.12); border-color: rgba(244, 63, 94, 0.3); }
    .btn.danger:hover { background: rgba(244, 63, 94, 0.22); border-color: rgba(244, 63, 94, 0.5); }
    .btn.full { width: 100%; }

    .rightbar {
      padding: 30px 22px;
      height: 100dvh;
      position: sticky;
      top: 0;
      overflow-y: auto;
      border-left: 1px solid var(--line);
    }
    .right-title {
      font-weight: 800;
      font-size: 13px;
      margin: 27px 0 17px;
      display: flex;
      justify-content: space-between;
    }
    .right-title small { font-weight: 400; font-size: 10px; }
    .creator { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
    .creator .profile-link { flex: 1; }
    .creator .post-user strong { font-size: 11px; }
    .creator .post-user small { font-size: 10px; }
    .creator > button { font-size: 18px; }
    .topic { border-bottom: 1px solid #ffffff06; padding: 13px 0; }
    .topic strong { font-size: 12px; display: block; }
    .topic small { font-size: 10px; }

    .empty {
      text-align: center;
      border: 1px dashed #343444;
      border-radius: 22px;
      padding: 70px 24px;
      background: #111119;
    }
    .empty > svg { width: 45px; height: 45px; color: var(--purple); margin-bottom: 15px; }
    .empty h2 { font-size: 21px; }
    .empty p { color: var(--muted); max-width: 310px; margin: 0 auto 20px; }
    .profile-banner {
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: radial-gradient(at top right, #9970ff20, transparent 70%), var(--panel);
      margin-bottom: 25px;
    }
    .profile-banner h2 { margin: 15px 0 0; }
    .profile-banner p { color: var(--muted); margin: 13px 0; white-space: pre-wrap; }
    .stats { display: flex; gap: 24px; margin: 18px 0; font-size: 12px; }
    .stats strong { color: white; margin-right: 5px; }

    dialog {
      color: var(--text);
      width: min(540px, calc(100vw - 28px));
      max-height: 88dvh;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: #111118;
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.05);
      position: fixed;
      inset: 0;
      margin: auto;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: modalPop .22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    dialog:not([open]) { display: none !important; }
    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.96) translateY(8px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    dialog.wide { width: min(800px, calc(100vw - 28px)); }
    dialog::backdrop { background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(14px); }
    .modal-head {
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      background: #13131c;
    }
    .modal-head h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.4px; color: #fafafa; }
    .modal-body {
      padding: 24px;
      overflow-y: auto;
      overscroll-behavior: contain;
      flex: 1;
      min-height: 0;
    }
    .form { display: grid; gap: 16px; }
    .form label, .form-label { display: grid; gap: 7px; color: #d4d4d8; font-size: 12.5px; font-weight: 600; }
    .form input, .form textarea, .form select {
      width: 100%;
      background: #0a0a10;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      color: #f4f4f5;
      padding: 11px 14px;
      font-size: 13.5px;
      min-width: 0;
      transition: border-color .15s, box-shadow .15s;
    }
    .form input:focus, .form textarea:focus, .form select:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.22);
    }
    .form textarea { min-height: 90px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    @media (max-width: 640px) { .form-row { grid-template-columns: 1fr; } }
    .switcher { display: flex; gap: 7px; margin-bottom: 22px; flex-wrap: wrap; }
    .switcher button { flex: 1; border-radius: 10px; }
    .switcher button.selected { background: rgba(139, 92, 246, 0.2); border-color: rgba(139, 92, 246, 0.6); color: #ffffff; }
    .notice {
      border: 1px solid rgba(6, 182, 212, 0.3);
      background: rgba(6, 182, 212, 0.08);
      padding: 14px;
      border-radius: 12px;
      color: #a5f3fc;
      font-size: 12.5px;
      margin-bottom: 18px;
    }

    /* Modern Select Wrap */
    .select-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .select-wrap select {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 40px;
      cursor: pointer;
    }
    .select-chevron {
      position: absolute;
      right: 14px;
      pointer-events: none;
      color: var(--muted);
      display: grid;
      place-items: center;
    }
    .select-chevron svg { width: 14px; height: 14px; }

    /* Custom iOS / Tailwind Toggle Switch */
    .studio-switch-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .studio-switch-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .studio-switch-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13.5px;
      color: #fafafa;
    }
    .studio-switch-title svg { width: 16px; height: 16px; color: var(--pink); }
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      cursor: pointer;
    }
    .switch-text {
      flex: 1;
      min-width: 0;
    }
    .switch-title {
      font-size: 13.5px;
      color: #ffffff;
      display: block;
      margin-bottom: 2px;
    }
    .switch-toggle, .toggle-switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 28px;
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
      margin: 0;
    }
    .switch-input, .toggle-switch input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
      outline: none !important;
      border: none !important;
      box-shadow: none !important;
    }
    .switch-slider, .toggle-slider {
      position: absolute;
      inset: 0;
      background-color: #272733;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 9999px;
      transition: background .22s ease, border-color .22s ease, box-shadow .22s ease;
      cursor: pointer;
      display: block;
    }
    .switch-slider::before, .toggle-slider::before, .toggle-slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      top: 3px;
      background-color: #ffffff;
      border-radius: 50%;
      transition: transform .22s cubic-bezier(0.4, 0, 0.2, 1), background .22s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
    }
    .switch-input:checked + .switch-slider,
    .toggle-switch input:checked + .toggle-slider {
      background: linear-gradient(135deg, var(--pink), var(--purple));
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 14px rgba(244, 63, 94, 0.4);
    }
    .switch-input:checked + .switch-slider::before,
    .toggle-switch input:checked + .toggle-slider:before {
      transform: translateX(20px);
    }
    .switch-toggle:focus-within .switch-slider {
      outline: none !important;
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.4);
    }

    /* Input with suffix/prefix badge */
    .input-with-badge {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-with-badge input {
      padding-right: 48px;
    }
    .input-badge {
      position: absolute;
      right: 12px;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.08);
      padding: 3px 7px;
      border-radius: 6px;
      pointer-events: none;
    }

    /* Modern Upload Dropzone */
    .dropzone {
      position: relative;
      border: 2px dashed rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.02);
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      cursor: pointer;
      transition: all .2s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 160px;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--purple);
      background: rgba(139, 92, 246, 0.07);
      box-shadow: 0 0 24px rgba(139, 92, 246, 0.18);
      transform: translateY(-1px);
    }
    .dropzone.has-file {
      padding: 12px;
      border-style: solid;
      border-color: rgba(255, 255, 255, 0.14);
      background: rgba(18, 18, 26, 0.85);
    }
    .dropzone-file-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
      z-index: 5;
    }
    .dropzone-prompt {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    .dropzone-icon-box {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(244, 63, 94, 0.18), rgba(139, 92, 246, 0.18));
      border: 1px solid rgba(139, 92, 246, 0.35);
      color: var(--pink);
      display: grid;
      place-items: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
      transition: transform .2s ease;
    }
    .dropzone:hover .dropzone-icon-box {
      transform: scale(1.08) translateY(-2px);
    }
    .dropzone-icon-box svg { width: 24px; height: 24px; }
    .dropzone-text-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .dropzone-title {
      font-size: 14px;
      font-weight: 700;
      color: #fafafa;
    }
    .dropzone-sub {
      font-size: 12px;
      color: var(--muted);
    }
    .dropzone-tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 4px;
    }
    .dropzone-tag {
      font-size: 10.5px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      color: #a1a1aa;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Media Preview Card in Dropzone */
    .preview-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: relative;
      z-index: 10;
    }
    .preview-media-box {
      position: relative;
      max-height: 280px;
      border-radius: 12px;
      overflow: hidden;
      background: #09090e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .preview-media-box img, .preview-media-box video {
      max-height: 280px;
      max-width: 100%;
      object-fit: contain;
      display: block;
    }
    .preview-info-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 4px 6px;
      gap: 10px;
    }
    .preview-name-col {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      text-align: left;
    }
    .preview-name-col strong {
      font-size: 12.5px;
      color: #f4f4f5;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .preview-name-col small {
      font-size: 11px;
      color: var(--muted);
    }
    .preview-clear-btn {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all .15s ease;
      z-index: 20;
    }
    .preview-clear-btn:hover {
      background: rgba(244, 63, 94, 0.22);
      border-color: rgba(244, 63, 94, 0.5);
      color: #ffffff;
    }

    /* Avatar Modern Dropzone */
    .avatar-dropzone {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      position: relative;
      cursor: pointer;
      transition: all .2s ease;
    }
    .avatar-dropzone:hover {
      border-color: var(--purple);
      background: rgba(139, 92, 246, 0.06);
    }
    .avatar-dropzone-circle {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.25);
      background: #14141e;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      color: var(--muted);
      transition: all .2s ease;
    }
    .avatar-dropzone:hover .avatar-dropzone-circle {
      border-color: var(--pink);
      color: var(--pink);
      transform: scale(1.04);
    }
    .avatar-dropzone-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .avatar-dropzone-info strong {
      display: block;
      font-size: 13.5px;
      color: #fafafa;
      margin-bottom: 2px;
    }
    .avatar-dropzone-info small {
      display: block;
      font-size: 11.5px;
      color: var(--muted);
    }

    /* Studio Layout & Hero */
    .studio-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
      animation: fadeIn .2s ease;
    }
    .studio-hero {
      background: radial-gradient(circle at top right, rgba(244, 63, 94, 0.12), transparent 70%),
                  radial-gradient(circle at top left, rgba(139, 92, 246, 0.15), transparent 70%),
                  var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 24px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
    .studio-hero-main {
      flex: 1;
      min-width: 250px;
    }
    .studio-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: var(--pink);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .studio-hero h2 {
      font-size: 24px;
      font-weight: 850;
      letter-spacing: -0.8px;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .studio-hero p {
      font-size: 13px;
      margin: 0;
      color: var(--muted);
      max-width: 480px;
    }
    .studio-stats-row {
      display: flex;
      gap: 12px;
    }
    .studio-stat-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px 18px;
      text-align: center;
      min-width: 90px;
    }
    .studio-stat-num {
      display: block;
      font-size: 20px;
      font-weight: 850;
      color: #ffffff;
      line-height: 1.2;
    }
    .studio-stat-lbl {
      display: block;
      font-size: 10.5px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 3px;
    }

    /* Studio Segmented Switcher Tabs */
    .studio-nav {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--line);
      overflow-x: auto;
    }
    .studio-tab-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: all .18s ease;
      cursor: pointer;
    }
    .studio-tab-btn svg { width: 17px; height: 17px; }
    .studio-tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
    }
    .studio-tab-btn.active {
      background: #181824;
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.14);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    /* Studio Panel Card */
    .studio-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 26px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    }
    .studio-form {
      max-width: 640px;
      margin: 0 auto;
    }
    .studio-notice {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(139, 92, 246, 0.08);
      border: 1px solid rgba(139, 92, 246, 0.22);
      border-left: 3px solid var(--purple);
      border-radius: 12px;
      color: #ddd6fe;
      font-size: 12.5px;
      line-height: 1.5;
    }
    .studio-notice svg { width: 20px; height: 20px; color: var(--purple); flex-shrink: 0; margin-top: 1px; }

    /* Studio Manage Posts Grid */
    .studio-manage-head {
      margin-bottom: 18px;
    }
    .studio-manage-head h3 {
      font-size: 17px;
      font-weight: 750;
      margin: 0 0 3px;
      color: #ffffff;
    }
    .studio-posts-grid {
      display: grid;
      gap: 14px;
    }
    .studio-post-card {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px 16px;
      transition: all .2s ease;
    }
    .studio-post-card:hover {
      background: rgba(255, 255, 255, 0.045);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }
    .studio-post-thumb {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      background: #0e0e16;
      border: 1px solid rgba(255, 255, 255, 0.1);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
    }
    .studio-post-thumb img, .studio-post-thumb video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .thumb-kind-badge {
      position: absolute;
      bottom: 4px;
      left: 4px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      font-size: 9px;
      font-weight: 700;
      color: #ffffff;
      padding: 2px 5px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .thumb-kind-badge svg { width: 9px; height: 9px; }
    .thumb-prem-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      background: linear-gradient(135deg, var(--pink), var(--purple));
      color: white;
      font-size: 9px;
      font-weight: 750;
      padding: 2px 5px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
    }
    .thumb-prem-badge svg { width: 8px; height: 8px; }
    .studio-post-details {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .studio-post-author {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .studio-post-author strong { font-size: 12px; color: #fafafa; }
    .studio-post-author small { font-size: 11px; margin-left: 4px; }
    .studio-post-caption {
      margin: 0;
      font-size: 12.5px;
      color: #d4d4d8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .studio-post-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 2px;
    }
    .studio-post-date {
      font-size: 11px;
      color: var(--muted);
    }
    .studio-post-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .checkout-price { font-size: 47px; font-weight: 850; letter-spacing: -2px; margin: 20px 0; color: #ffffff; }
    .checkout-price small { font-size: 13px; letter-spacing: 0; font-weight: 400; color: var(--muted); }
    .comment {
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      position: relative;
    }
    .comment:last-child { border-bottom: none; }
    .comment-delete-btn {
      opacity: 0;
      margin-left: auto;
      padding: 2px;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1px solid transparent;
      background: transparent;
      color: #71717a;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all .15s ease;
      flex-shrink: 0;
    }
    .comment:hover .comment-delete-btn,
    .comment:focus-within .comment-delete-btn {
      opacity: 1;
    }
    .comment-delete-btn:hover {
      background: rgba(244, 63, 94, 0.16);
      color: #f43f5e;
      border-color: rgba(244, 63, 94, 0.35);
      transform: scale(1.08);
    }
    .comment-delete-btn svg { width: 13px; height: 13px; }
    @media (hover: none) {
      .comment-delete-btn { opacity: 0.85; }
    }
    .comment strong { font-size: 12px; }
    .comment small { font-size: 10px; margin-left: 8px; }
    .comment p { margin: 6px 0 0; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .comment-list { max-height: 42dvh; overflow: auto; margin-bottom: 20px; }
    .preview {
      max-height: 240px;
      max-width: 100%;
      margin-top: 6px;
      border-radius: 12px;
      background: black;
    }
    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translate(-50%, 15px);
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      background: #242431;
      color: white;
      border: 1px solid #454558;
      border-radius: 13px;
      padding: 13px 20px;
      box-shadow: 0 12px 45px #0008;
      z-index: 100;
      max-width: calc(100vw - 30px);
      text-align: center;
    }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    .mobile-nav { display: none; }

    /* Lightbox Preview Modal */
    dialog.lightbox {
      width: min(1180px, calc(100vw - 28px));
      height: min(880px, 92dvh);
      max-height: 92dvh;
      border-radius: 20px;
      background: #0d0d14;
      border: 1px solid #323244;
      box-shadow: 0 35px 140px #000000d0;
      position: fixed;
      inset: 0;
      margin: auto;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    dialog.lightbox:not([open]) { display: none !important; }
    .lightbox-body {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(320px, 1fr);
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }
    .lightbox-media-wrap {
      background: #040407;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }
    .lightbox-media-wrap img, .lightbox-media-wrap video {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .lightbox-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 18px 14px;
      background: linear-gradient(transparent, #000000cc);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 5;
    }
    .lightbox-progress-wrap {
      flex: 1;
      display: flex;
      align-items: center;
    }
    .lightbox-progress {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 3px;
      background: #ffffff33;
      outline: none;
      cursor: pointer;
    }
    .lightbox-progress::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 10px var(--pink);
    }
    .lightbox-progress::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--pink);
      border: none;
      box-shadow: 0 0 10px var(--pink);
    }
    .lightbox-time {
      font-size: 11px;
      color: #c9c9dc;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }
    .lightbox-sidebar {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      border-left: 1px solid var(--line);
      background: #111119;
    }
    .lightbox-sidebar-head {
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .lightbox-sidebar-content {
      padding: 18px 20px;
      overflow-y: auto;
      flex: 0 0 auto;
      max-height: 35%;
    }
    .lightbox-caption {
      font-size: 13.5px;
      line-height: 1.55;
      color: #ebebf5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin-bottom: 12px;
    }
    .lightbox-actions-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
      background: #14141f;
      width: 100%;
      box-sizing: border-box;
    }
    .lightbox-actions-row .action {
      display: flex !important;
      flex-direction: row !important;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
      padding: 7px 4px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: #d4d4d8;
      font-size: 11.5px;
      font-weight: 600;
      transition: all .16s ease;
      cursor: pointer;
    }
    .lightbox-actions-row .action i {
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      backdrop-filter: none;
      border-radius: 0;
      flex-shrink: 0;
    }
    .lightbox-actions-row .action i svg {
      width: 17px;
      height: 17px;
      display: block;
    }
    .lightbox-actions-row .action span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 11px;
    }
    .lightbox-actions-row .action:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.14);
      transform: translateY(-1px);
    }
    .lightbox-actions-row .action:active {
      transform: scale(0.96);
    }
    .lightbox-actions-row .action.on[data-action="like"] {
      color: #f43f5e;
      background: rgba(244, 63, 94, 0.16);
      border-color: rgba(244, 63, 94, 0.35);
    }
    .lightbox-actions-row .action.on[data-action="like"] svg,
    .lightbox-actions-row .action.on[data-action="like"] svg path {
      fill: #f43f5e !important;
      stroke: #f43f5e;
    }
    .lightbox-actions-row .action.on[data-action="save"] {
      color: #f59e0b;
      background: rgba(245, 158, 11, 0.16);
      border-color: rgba(245, 158, 11, 0.35);
    }
    .lightbox-actions-row .action.on[data-action="save"] svg,
    .lightbox-actions-row .action.on[data-action="save"] svg path {
      fill: #f59e0b !important;
      stroke: #f59e0b;
    }
    .lightbox-actions-row .action[data-action="comments"]:hover,
    .lightbox-actions-row .action[data-action="preview-comments-focus"]:hover {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.25);
    }
    .lightbox-actions-row .action[data-action="share"]:hover {
      color: #c084fc;
      background: rgba(192, 132, 252, 0.12);
      border-color: rgba(192, 132, 252, 0.25);
    }
    .lightbox-comments-wrap {
      padding: 14px 20px;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
    }
    .lightbox-comment-form-wrap {
      padding: 12px 20px;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
      background: #111119;
    }

    /* Share Modal Styles */
    .share-box {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .share-preview-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #161622;
      border: 1px solid #28283a;
      border-radius: 14px;
      padding: 12px 14px;
    }
    .share-input-row {
      display: flex;
      gap: 9px;
    }
    .share-input-row input {
      flex: 1;
      background: #0a0a10;
      border: 1px solid #2b2b3b;
      border-radius: 11px;
      color: #5be4df;
      padding: 11px 14px;
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .share-input-row input:focus {
      border-color: var(--cyan);
    }
    /* Comment replies & thread styles */
    .comment-thread {
      border-bottom: 1px solid var(--line);
      padding: 4px 0;
    }
    .comment-thread:last-child {
      border-bottom: none;
    }
    .comment-replies-wrap {
      margin-left: 24px;
      padding-left: 10px;
      border-left: 2px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-top: 3px;
      margin-bottom: 2px;
    }
    @media (max-width: 600px) {
      .comment-replies-wrap {
        margin-left: 14px;
        padding-left: 8px;
      }
    }
    .comment-reply {
      border-bottom: none !important;
      padding: 2px 0 !important;
    }
    .comment-reply p {
      margin: 2px 0 0 !important;
      font-size: 12px !important;
      line-height: 1.4 !important;
    }
    .comment-reply-arrow {
      color: var(--muted);
      font-size: 11px;
      margin: 0 1px;
      opacity: 0.6;
    }
    .comment-reply-badge {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      font-size: 10px;
      color: #c4b5fd;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid rgba(139, 92, 246, 0.28);
      padding: 0 5px;
      border-radius: 5px;
      font-weight: 600;
      line-height: 1.4;
    }
    .comment-reply-btn {
      background: transparent;
      border: none;
      color: #a1a1aa;
      font-size: 10.5px;
      font-weight: 600;
      padding: 1px 5px;
      border-radius: 4px;
      cursor: pointer;
      transition: all .15s ease;
      display: inline-flex;
      align-items: center;
      line-height: 1;
    }
    .comment-reply-btn:hover {
      color: #f43f5e;
      background: rgba(244, 63, 94, 0.1);
    }

    /* Modern Comment As User Bar & Select */
    .comment-as-user-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, rgba(24, 24, 36, 0.85), rgba(18, 18, 27, 0.95));
      padding: 7px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }
    .comment-as-user-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--pink);
      white-space: nowrap;
    }
    .comment-as-user-badge svg {
      width: 14px;
      height: 14px;
      color: var(--pink);
    }
    .comment-as-select-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
    }
    .comment-as-select {
      width: 100%;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
      background: #0d0d15;
      color: #f4f4f5;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 6px 30px 6px 11px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      outline: none !important;
      transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
    }
    .comment-as-select:hover {
      background: #141422;
      border-color: rgba(244, 63, 94, 0.4);
    }
    .comment-as-select:focus {
      border-color: var(--pink);
      box-shadow: 0 0 0 2px rgba(244, 63, 94, 0.25);
    }
    .comment-as-select option {
      background: #12121c;
      color: #f4f4f5;
      padding: 6px 10px;
    }
    .comment-as-arrow {
      position: absolute;
      right: 9px;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a1a1aa;
      transition: transform .15s ease, color .15s ease;
    }
    .comment-as-arrow svg {
      width: 14px;
      height: 14px;
    }
    .comment-as-select:focus + .comment-as-arrow {
      color: var(--pink);
      transform: rotate(180deg);
    }

    /* Avatar Preview Modal Styles */
    .avatar-modal-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 16px;
      padding: 8px 0;
    }
    .avatar-modal-display {
      width: min(280px, 72vw);
      height: min(280px, 72vw);
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.65), 0 0 35px rgba(139, 92, 246, 0.25);
      background: #090910;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .avatar-full-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .avatar-full-fallback {
      width: 100% !important;
      height: 100% !important;
      font-size: 96px !important;
      font-weight: 850;
      line-height: 1 !important;
      display: flex !important;
      align-items: center;
      justify-content: center;
    }
    .avatar-modal-meta {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
    }
    .avatar-modal-meta h3 {
      font-size: 21px;
      font-weight: 850;
      margin: 0 0 3px;
      color: #ffffff;
    }
    .avatar-modal-bio {
      font-size: 13px;
      color: #d4d4d8;
      margin: 10px 0 0;
      max-width: 360px;
      line-height: 1.45;
      text-align: center;
    }
    .avatar-modal-stats {
      display: flex;
      gap: 20px;
      justify-content: center;
      font-size: 13px;
      color: var(--muted);
      margin-top: 10px;
    }
    .avatar-modal-stats strong { color: #fafafa; }
    .avatar-modal-footer {
      width: 100%;
      max-width: 240px;
      margin: 16px auto 0 auto;
      display: flex;
      justify-content: center;
    }
    .reply-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(139, 92, 246, 0.12);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 11.5px;
      color: #c4b5fd;
    }
    .reply-bar strong {
      color: #f43f5e;
    }
    .reply-cancel-btn {
      background: transparent;
      border: none;
      color: #a1a1aa;
      cursor: pointer;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .reply-cancel-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
    }

    @media (min-width: 1450px) {
      .main { padding-left: 55px; padding-right: 55px; }
    }
    @media (max-width: 1150px) {
      .shell { grid-template-columns: 210px minmax(0, 1fr); max-width: 1050px; }
      .rightbar { display: none; }
      .sidebar { padding-left: 16px; padding-right: 16px; }
    }
    @media (max-width: 860px) {
      dialog.lightbox {
        width: 100vw;
        height: 100dvh;
        max-height: 100dvh;
        border-radius: 0;
        border: none;
      }
      .lightbox-body {
        grid-template-columns: 1fr;
        height: 100%;
        overflow-y: auto;
      }
      .lightbox-media-wrap {
        height: 48vh;
        min-height: 280px;
      }
      .lightbox-sidebar {
        border-left: none;
        border-top: 1px solid var(--line);
        height: auto;
        min-height: 400px;
      }
    }
    @media (max-width: 720px) {
      .shell { display: block; }
      .sidebar { display: none; }
      .main { padding: 0 14px 90px; }
      .topbar { min-height: 67px; gap: 10px; }
      .tabs { gap: 17px; }
      .tab { padding: 23px 0; font-size: 12px; }
      .tab.active::after { bottom: 10px; }
      .search { max-width: 130px; padding: 8px; }
      .search input { font-size: 11px; }
      .feed-heading { margin: 19px 0 15px; }
      .feed-heading h1 { font-size: 21px; }
      .stories { gap: 15px; }
      .media { border-radius: 18px; max-height: none; aspect-ratio: 9/14; }
      .post { max-width: 470px; }
      .mobile-nav {
        display: flex;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 20;
        background: #101018f5;
        backdrop-filter: blur(15px);
        justify-content: space-around;
        border-top: 1px solid var(--line);
        padding: 11px 5px calc(11px + env(safe-area-inset-bottom));
      }
      .mobile-nav button {
        border: 0;
        background: none;
        display: grid;
        justify-items: center;
        gap: 4px;
        font-size: 9px;
        color: #b1b1c3;
      }
      .mobile-nav button.active { color: var(--pink); }
      .mobile-nav .upload-mobile {
        background: linear-gradient(110deg, var(--pink), var(--purple));
        border-radius: 10px;
        padding: 7px 18px;
        color: white;
      }
      .toast { bottom: 90px; }
      .form-row { grid-template-columns: 1fr; }
      .modal-body { padding: 20px; }
      .lock-card { padding: 23px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>

<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="LOOP ana sayfa">
        <span class="brand-mark" data-icon="play"></span> LOOP<span style="color:var(--pink)">.</span>
      </a>

      <nav class="nav">
        <button data-route="home"><span data-icon="home"></span> Senin için</button>
        <button data-route="following"><span data-icon="users"></span> Takip edilenler</button>
        <button data-route="premium"><span data-icon="spark"></span> Özel içerikler</button>
        <button data-route="saved"><span data-icon="bookmark"></span> Kaydedilenler</button>
        <button data-action="my-profile"><span data-icon="user"></span> Profilim</button>
      </nav>

      <div class="side-label">İçerik stüdyosu</div>
      <nav class="nav">
        <button data-action="admin"><span data-icon="grid"></span> Yönetim paneli</button>
      </nav>

      <div class="side-bottom">
        <div id="account"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="tabs">
          <button class="tab" data-route="home">Senin için</button>
          <button class="tab" data-route="following">Takip</button>
          <button class="tab" data-route="premium">Özel</button>
        </div>
        <label class="search">
          <span data-icon="search"></span>
          <input id="search" placeholder="İçerik veya kişi ara" aria-label="İçerik veya kişi ara">
        </label>
      </header>

      <div class="feed-heading">
        <div>
          <div class="eyebrow">Bir sonraki favorini keşfet</div>
          <h1 id="pageTitle">Akışına hoş geldin.</h1>
        </div>
      </div>

      <section id="stories" class="stories" aria-label="Profiller"></section>
      <section id="profileBanner"></section>
      <section id="feed" class="feed" aria-label="İçerik akışı">
        <div class="empty"><h2>Akış yükleniyor...</h2></div>
      </section>
    </main>

    <aside class="rightbar">
      <button class="btn primary full" data-action="admin">
        <span data-icon="plus"></span> İçerik oluştur
      </button>

      <div class="right-title">Keşfedilecek hesaplar <small>TOPLULUK</small></div>
      <div id="creators"></div>

      <div class="right-title">Topluluk özeti</div>
      <div id="communityStats"></div>
    </aside>
  </div>

  <nav class="mobile-nav">
    <button data-route="home"><span data-icon="home"></span> Akış</button>
    <button data-route="premium"><span data-icon="spark"></span> Özel</button>
    <button data-action="admin" class="upload-mobile" aria-label="Yönetim paneli"><span data-icon="plus"></span></button>
    <button data-route="saved"><span data-icon="bookmark"></span> Kayıtlar</button>
    <button data-action="my-profile"><span data-icon="user"></span> Profil</button>
  </nav>

  <dialog id="modal" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="modal-close-btn" data-action="close" aria-label="Pencereyi kapat">
        <span data-icon="close"></span>
      </button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </dialog>

  <dialog id="previewModal" class="lightbox" aria-label="Büyük Önizleme">
    <div id="previewModalBody" class="lightbox-body"></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const paths = {
      home: '<path d="m3 10 9-7 9 7v10H15v-6H9v6H3z"/>',
      users: '<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M21 21v-3a6 6 0 0 0-3-5"/>',
      user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',
      spark: '<path d="m12 3 2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4z"/>',
      bookmark: '<path d="M6 3h12v18l-6-4-6 4z"/>',
      heart: '<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',
      comment: '<path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H3l2-5a8.5 8.5 0 1 1 16-3.5z"/>',
      share: '<path d="m14 3 7 7-7 7v-4C7 13 4 16 3 21V11c0-3 5-5 11-5z"/>',
      lock: '<rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      close: '<path d="M18 6 6 18M6 6l12 12"/>',
      chevronDown: '<path d="m6 9 6 6 6-6"/>',
      search: '<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',
      grid: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
      play: '<path d="m8 4 12 8-12 8z"/>',
      pause: '<rect x="6" y="4" width="4" height="16" rx="1.5"/><rect x="14" y="4" width="4" height="16" rx="1.5"/>',
      music: '<path d="M9 18V5l12-2v13M9 8l12-2"/><ellipse cx="6" cy="18" rx="3" ry="3"/><ellipse cx="18" cy="16" rx="3" ry="3"/>',
      volume: '<path d="m11 4-6 5H2v6h3l6 5zM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/>',
      volumeLow: '<path d="m11 4-6 5H2v6h3l6 5zM15 9a4 4 0 0 1 0 6"/>',
      mute: '<path d="m11 4-6 5H2v6h3l6 5zM16 9l6 6M16 15l6-6"/>',
      logout: '<path d="M9 4H4v16h5M9 12h12m-5-5 5 5-5 5"/>',
      check: '<path d="m5 12 4 4L20 5"/>',
      copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
      expand: '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>',
      image: '<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1"/><path d="m3 17 6-6 4 4 3-3 5 5"/>',
      upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
      camera: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
      trash: '<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/>',
      video: '<polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>',
      layers: '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
      edit: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>'
    };

    const icon = name =>
      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">${paths[name] || paths.spark}</svg>`;

    document.querySelectorAll("[data-icon]").forEach(el => {
      el.innerHTML = icon(el.dataset.icon);
    });

    const $ = selector => document.querySelector(selector);
    const esc = value => String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    })[char]);

    let csrf = document.querySelector('meta[name="csrf-token"]')?.getAttribute("content") || "";
    let state = { me: null, profiles: [], posts: [] };
    let route = "home";
    let profileId = null;
    let query = "";
    let authMode = "login";
    let adminTab = "posts";
    let activeComments = null;
    let activeReplyParent = null;
    let activeLightboxReplyParent = null;
    let previewURL = null;
    let toastTimer;
    let stateRequest = 0;
    let commentRequest = 0;
    const pendingActions = new Set();

    const money = amount => new Intl.NumberFormat("tr-TR", {
      style: "currency", currency: "TRY", maximumFractionDigits: 0
    }).format(amount);

    const count = number => new Intl.NumberFormat("tr-TR", {
      notation: "compact", maximumFractionDigits: 1
    }).format(number);

    function toast(message) {
      $("#toast").textContent = message;
      $("#toast").classList.add("visible");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => $("#toast").classList.remove("visible"), 3600);
    }

    async function api(url, { method = "GET", data } = {}) {
      const headers = { "X-CSRF-Token": csrf };
      const options = { method, headers, credentials: "same-origin" };

      if (data instanceof FormData) {
        options.body = data;
      } else if (data !== undefined) {
        headers["Content-Type"] = "application/json";
        options.body = JSON.stringify(data);
      }

      const response = await fetch(url, options);
      const result = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(result.error || `İşlem başarısız (${response.status}).`);
      }
      if (result.csrf) csrf = result.csrf;
      return result;
    }

    function avatar(user, extra = "") {
      const src = user?.avatar
        ? (user.avatar.startsWith("/media/") || user.avatar.startsWith("http")
            ? user.avatar
            : `/media/${user.avatar}`)
        : null;
      const rawName = (user?.name || user?.username || "?").trim();
      const initial = (rawName.charAt(0) || "?").toLocaleUpperCase("tr-TR");
      const uid = user?.id ? `data-action="view-avatar" data-id="${user.id}" title="${esc(rawName)} - Profil fotoğrafını büyüt"` : "";
      if (src) {
        return `<img class="avatar ${extra}" src="${esc(src)}" alt="${esc(rawName)}" loading="lazy" ${uid}>`;
      }
      return `<span class="avatar avatar-fallback ${extra}" ${uid}>${esc(initial)}</span>`;
    }

    function openAvatarModal(id) {
      const numId = Number(id);
      const user = author(numId) || (state.me?.id === numId ? state.me : null);
      if (!user) return;

      const src = user.avatar
        ? (user.avatar.startsWith("/media/") || user.avatar.startsWith("http")
            ? user.avatar
            : `/media/${user.avatar}`)
        : null;

      openModal("Profil Detayı", `
        <div class="avatar-modal-card">
          <div class="avatar-modal-display">
            ${src
              ? `<img src="${esc(src)}" alt="${esc(user.name)}" class="avatar-full-img">`
              : `<span class="avatar avatar-fallback avatar-full-fallback">${esc((user.name || user.username || "?").trim().charAt(0).toLocaleUpperCase("tr-TR"))}</span>`
            }
          </div>
          <div class="avatar-modal-meta">
            <h3>${esc(user.name)}</h3>
            <span class="muted">@${esc(user.username)}</span>
            ${user.bio ? `<p class="avatar-modal-bio">${esc(user.bio)}</p>` : ""}
            <div class="avatar-modal-stats">
              <span><strong>${user.post_count ?? 0}</strong> paylaşım</span>
              <span><strong>${user.followers ?? 0}</strong> takipçi</span>
            </div>
            <div class="avatar-modal-footer">
              <button class="btn primary full" data-action="profile" data-id="${user.id}">
                ${icon("user")} Profile Git
              </button>
            </div>
          </div>
        </div>
      `);
    }

    const author = id => state.profiles.find(user => user.id === id);
    const postById = id => state.posts.find(post => post.id === id);

    function profileButton(user) {
      return `<button class="profile-link" data-action="profile" data-id="${user.id}">
        ${avatar(user)}
        <span class="post-user">
          <strong>${esc(user.name)}</strong>
          <small>@${esc(user.username)}</small>
        </span>
      </button>`;
    }

    function needLogin() {
      if (state.me) return true;
      openAuth("login");
      return false;
    }

    function openModal(title, body, wide = false) {
      document.querySelectorAll(".media video").forEach(video => video.pause());
      releasePreview();
      $("#modal").classList.toggle("wide", wide);
      $("#modalTitle").textContent = title;
      $("#modalBody").innerHTML = body;
      if (!$("#modal").open) $("#modal").showModal();
    }

    function releasePreview() {
      if (previewURL) URL.revokeObjectURL(previewURL);
      previewURL = null;
    }

    function closeModal() {
      $("#modal").close();
    }

    $("#modal").addEventListener("close", () => {
      releasePreview();
      activeComments = null;
      activeReplyParent = null;
      commentRequest++;
      resumeVisibleVideo();
    });

    $("#modal").addEventListener("click", event => {
      if (event.target !== $("#modal")) return;
      const rect = $("#modal").getBoundingClientRect();
      if (
        event.clientX < rect.left || event.clientX > rect.right ||
        event.clientY < rect.top || event.clientY > rect.bottom
      ) closeModal();
    });

    let globalVolume = parseFloat(localStorage.getItem("loop_volume") || "0.8");
    if (isNaN(globalVolume) || globalVolume < 0 || globalVolume > 1) globalVolume = 0.8;
    let globalMuted = localStorage.getItem("loop_muted") === "1";
    let activePreviewId = null;
    let previewVideo = null;

    function setGlobalVolume(val, muted = null) {
      globalVolume = Math.max(0, Math.min(1, val));
      if (muted !== null) globalMuted = muted;
      else if (globalVolume === 0) globalMuted = true;
      else globalMuted = false;

      localStorage.setItem("loop_volume", String(globalVolume));
      localStorage.setItem("loop_muted", globalMuted ? "1" : "0");

      document.querySelectorAll("video").forEach(v => {
        v.volume = globalVolume;
        v.muted = globalMuted;
      });

      const isMutedNow = globalMuted || globalVolume === 0;
      const volPercent = isMutedNow ? 0 : Math.round(globalVolume * 100);

      document.querySelectorAll(".volume-slider").forEach(slider => {
        slider.value = isMutedNow ? 0 : globalVolume;
        slider.style.setProperty("--vol-percent", `${volPercent}%`);
      });

      document.querySelectorAll(".volume-control").forEach(ctrl => {
        ctrl.classList.toggle("is-muted", isMutedNow);
      });

      const iconName = isMutedNow ? "mute" : (globalVolume < 0.5 ? "volumeLow" : "volume");
      document.querySelectorAll('[data-action="mute"], [data-action="preview-mute-toggle"]').forEach(btn => {
        btn.innerHTML = icon(iconName);
        btn.setAttribute("aria-label", isMutedNow ? "Sesi aç" : "Sesi kapat");
      });
    }

    function toggleGlobalMute() {
      if (globalMuted) {
        setGlobalVolume(globalVolume <= 0 ? 0.8 : globalVolume, false);
      } else {
